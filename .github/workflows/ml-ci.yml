name: ML Serving CI

on:
  push:
    paths:
      - ml-serving/**
  pull_request:
    paths:
      - ml-serving/**

jobs:
  ml-serving-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd ml-serving
          pip install -r requirements.txt

      - name: Import FastAPI app
        run: |
          cd ml-serving
          python - <<EOF
          import app.main
          print("✅ FastAPI app import OK")
          EOF
